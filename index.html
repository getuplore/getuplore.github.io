<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uplore</title>
<meta name="description" content="Uplore: Maths, English and more for the whole family, from JK to grown-ups.">
<meta name="theme-color" content="#2f9e8f">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='38' width='14' height='20' rx='4' fill='%239fd8cf'/%3E%3Crect x='25' y='27' width='14' height='31' rx='4' fill='%235cbcae'/%3E%3Crect x='44' y='15' width='14' height='43' rx='4' fill='%232f9e8f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Uplore home: one place for every subject. Warm cream, a calm teal, and each subject's own colour. */
:root{--bg:#fdf8ef;--surface:#fff;--ink:#22303c;--muted:#5d6b78;--line:#22303c1a;--teal:#2f9e8f;--teal-ink:#fff;--brown:#b07a45;--rad:22px;--shadow:0 6px 0 #22303c14;
  --maths:#ff6b4a;--english:#4c6ef5;--computers:#2f9e44;--french:#d6336c}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:radial-gradient(70% 50% at 100% 0%,#ffe8c2 0,transparent 70%),radial-gradient(60% 40% at 0% 100%,#d3f0ea 0,transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font:500 17px/1.5 Inter,system-ui,sans-serif;min-height:100vh}
a{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
h1,h2,h3{font-family:"Baloo 2",system-ui,sans-serif;line-height:1.05;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:clamp(16px,4vw,40px)}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand svg{width:56px;height:56px;flex:none}
.brand h1{font-size:clamp(30px,5vw,40px);letter-spacing:-.01em}
.brand h1 span{color:var(--teal)}
.acct{font-size:14px;color:var(--muted);text-align:right}
.acct b{color:var(--ink)}
.acct .out{margin-top:6px;font-weight:700;color:var(--teal);text-decoration:underline;text-underline-offset:3px;min-height:32px}
.acct .warn{display:block;max-width:22em;margin-top:4px;color:#b54708;font-size:13px}
.hero{margin:clamp(18px,4vw,36px) 0 clamp(14px,3vw,24px)}
.hero h2{font-size:clamp(26px,4.4vw,40px)}
.hero p{margin:6px 0 0;color:var(--muted);max-width:40em}
.who{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.who .lab{font-weight:700;margin-right:4px}
.who.ask .lab{color:#b54708}.who.ask .chip[data-id]{animation:nudge .5s 2}
@keyframes nudge{50%{transform:translateY(-4px);box-shadow:0 0 0 3px #ffd16699}}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:6px 16px 6px 6px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:700}
.chip i{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;color:#fff;font-style:normal;font-family:"Baloo 2",system-ui;font-size:20px}
.chip[aria-pressed=true]{border-color:var(--teal);box-shadow:0 0 0 3px #2f9e8f33}
.chip small{display:block;font-weight:500;color:var(--muted);font-size:12px;line-height:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:clamp(12px,2.4vw,20px)}
.tile{position:relative;display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:var(--rad);padding:20px;box-shadow:var(--shadow);border:2px solid var(--line);text-decoration:none;min-height:240px;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 0 auto;height:8px;background:var(--c)}
.tile .ic{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:#f1f3f5;background:color-mix(in srgb,var(--c) 14%,#fff);font-size:34px}
.tile .ic img{width:56px;height:56px;border-radius:14px}
.tile h3{font-size:26px}
.tile p{margin:0;color:var(--muted);font-size:15px}
.tile .go{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;background:var(--c);color:#fff;font-weight:700;padding:0 18px}
.tile .soon{margin-top:auto;display:inline-flex;align-self:flex-start;font-weight:700;font-size:13px;border-radius:999px;padding:6px 12px;background:#f1f3f5;color:var(--muted)}
.tile.live{cursor:pointer;transition:transform .15s}
.tile.live:hover{transform:translateY(-3px)}
.prog{font-size:14px;font-weight:600;color:var(--ink);background:#f8f9fa;border-radius:12px;padding:8px 10px}
.prog .bar{height:8px;border-radius:99px;background:#e9ecef;margin-top:6px;overflow:hidden}.prog .bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.note{margin-top:clamp(18px,4vw,30px);display:flex;gap:12px;align-items:flex-start;background:#ffffffb3;border:2px dashed var(--line);border-radius:18px;padding:14px 16px;font-size:15px;color:var(--muted)}
.note b{color:var(--ink)}
.who .add{border-style:dashed;padding:6px 16px;color:var(--teal)}
.hbtn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;font-weight:700;font-size:15px;border:2px solid var(--line);background:var(--surface)}
.hbtn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.acct .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.sheet{position:fixed;inset:0;background:#22303c66;display:grid;justify-items:center;align-items:center;align-items:safe center;padding:16px;z-index:10;overflow:auto}
.sheet[hidden]{display:none}
.card{width:min(440px,100%);background:var(--surface);border-radius:24px;padding:24px;box-shadow:0 20px 60px #22303c33;position:relative}
.card h3{font-size:28px;margin-bottom:6px}
.card p.sub{margin:0 0 14px;color:var(--muted);font-size:15px}
.card .x{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;font-size:24px;line-height:1;color:var(--muted)}
.card label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px;color:var(--muted)}
.card input{width:100%;min-height:48px;border:2px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;background:#fff;color:var(--ink)}
.card input:focus{border-color:var(--teal);outline:none}
.pw{position:relative}.pw input{padding-right:72px}.pw button{position:absolute;right:6px;top:6px;height:36px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--teal)}
.card .go{width:100%;margin-top:18px;min-height:50px;border-radius:14px;background:var(--teal);color:#fff;font-weight:800;font-size:17px}
.card .go:disabled{opacity:.5;cursor:default}
.card .links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:14px}
.card .links button{color:var(--teal);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.card .msg{margin-top:12px;font-size:14px;border-radius:12px;padding:10px 12px}
.card .msg.err{background:#fff1f0;color:#b42318}.card .msg.ok{background:#e9f7f4;color:#1d6b60}
.card .msg:empty{display:none}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{min-width:52px;min-height:44px;border-radius:12px;border:2px solid var(--line);font-weight:700;padding:0 10px}
.opts button[aria-pressed=true]{border-color:var(--teal);background:#e9f7f4}
.sws{display:flex;gap:10px;flex-wrap:wrap}.sws button{width:40px;height:40px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sws button[aria-pressed=true]{box-shadow:0 0 0 3px var(--c)}
/* Grown-ups */
.card.wide{width:min(760px,100%)}
.gsec{border-top:2px solid var(--line);margin-top:18px;padding-top:14px}
.gsec h4{margin:0 0 8px;font:700 15px/1.3 Inter,system-ui,sans-serif;color:var(--muted)}
.lrow{display:flex;align-items:center;gap:12px;padding:6px 0}
.lrow i{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:#fff;font-style:normal;font-family:"Baloo 2",system-ui;font-size:20px;flex:none}
.lrow span{flex:1;font-weight:700}.lrow small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.hbtn.sm{min-height:40px;font-size:14px;padding:0 12px}
.hbtn.danger{color:#b42318}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;font-weight:600}
.card label.set{display:flex;margin:0;font-size:inherit;color:inherit;font-weight:600}
.set select{min-height:44px;border:2px solid var(--line);border-radius:12px;padding:0 10px;font:inherit;background:#fff;color:var(--ink)}
.tog{width:58px;height:34px;border-radius:99px;background:#ced4da;position:relative;flex:none}
.tog::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.tog[aria-pressed=true]{background:var(--teal)}.tog[aria-pressed=true]::after{left:28px}
.gst{font-size:13px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.kpis div{background:#f8f9fa;border-radius:12px;padding:10px 12px}.kpis b{display:block;font:800 26px/1.1 "Baloo 2",system-ui}.kpis span{font-size:13px;color:var(--muted)}
.admline{font-size:14px;margin:10px 0 0}.admline b{color:var(--ink)}
.adm ol{margin:6px 0 0;padding-left:22px;font-size:14px}
.gsum{display:flex;align-items:center;gap:10px;font:800 30px/1 "Baloo 2",system-ui}.gsum input{width:110px;font-size:24px;text-align:center}
.acct .hbtn{margin-top:6px}
footer{margin-top:28px;font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
@media (max-width:520px){.acct{text-align:left;width:100%}.tile{min-height:0}}
@media (prefers-reduced-motion:reduce){.tile.live{transition:none}.who.ask .chip[data-id]{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="./" aria-label="Uplore home">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="38" width="14" height="20" rx="4" fill="#9fd8cf"/><rect x="25" y="27" width="14" height="31" rx="4" fill="#5cbcae"/><rect x="44" y="15" width="14" height="43" rx="4" fill="#2f9e8f"/><path d="M51 2.5l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5-3.6-3.5 5-.7z" fill="#ffd166" stroke="#e0a800" stroke-width="1" stroke-linejoin="round"/></svg>
      <h1><span>Up</span>lore</h1>
    </a>
    <div class="acct" id="acct"></div>
  </header>

  <section class="hero">
    <h2 id="hello">What shall we learn today?</h2>
    <p id="lead"></p>
    <div class="who" id="who"></div>
  </section>

  <section class="grid" id="subjects" aria-label="Subjects"></section>

  <div class="note" id="note"></div>

  <footer><span>© Uplore</span><a href="maths/privacy.html">Privacy</a></footer>
</div>
<div class="sheet" id="sheet" hidden><div class="card" role="dialog" aria-modal="true" aria-labelledby="st"><button class="x" id="sx" aria-label="Close">×</button><div id="sc"></div></div></div>

<script>
// Uplore home. Reads the same learners and sign-in as Pip Maths (same web address, same storage).
(function () {
  'use strict';
  var KEY = 'pipmaths.v1', SKEY = 'pipmaths.session';
  var MATHS_LESSONS = 373;
  function read(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function write(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var $ = function (id) { return document.getElementById(id); };

  var demo = /[?&]demo/.test(location.search);
  var state = read(KEY) || { profiles: [], active: null, settings: {} };
  if (demo && !state.profiles.length) state = { profiles: [
    { id: 'd1', name: 'Asha', age: 9, color: '#ff6b4a', progress: { a: { a: [[1, 1]], mastered: 1 }, b: { a: [[1, 1]] }, c: { a: [[1, 1]] } } },
    { id: 'd2', name: 'Ravi', age: 14, color: '#4c6ef5', progress: { a: { a: [[1, 1]] } } },
    { id: 'd3', name: 'Mum', age: 38, color: '#2f9e44', progress: {} }], active: 'd1', settings: {} };
  var session = read(SKEY);

  function learner() { for (var i = 0; i < state.profiles.length; i++) if (state.profiles[i].id === state.active) return state.profiles[i]; return null; }
  function stats(p) { var tried = 0, mastered = 0, pr = (p && p.progress) || {}; for (var k in pr) { if (pr[k] && pr[k].a && pr[k].a.length) tried++; if (pr[k] && pr[k].mastered) mastered++; } return { tried: tried, mastered: mastered }; }

  var SUBJECTS = [
    { id: 'maths', name: 'Maths', live: true, href: 'maths/', c: 'var(--maths)', icon: '<img src="maths/img/icon-64.png" alt="" onerror="this.replaceWith(document.createTextNode(\'🔢\'))">',
      text: 'Pip Maths: JK to grown-ups. School maths, tables, tricks, Vedic maths, logic, exam papers.' },
    { id: 'english', name: 'English', c: 'var(--english)', icon: '📖', soon: 'Being built now',
      text: 'Letter sounds, reading, spelling, grammar, vocabulary and writing. For first and second-language learners.' },
    { id: 'computers', name: 'Computers', c: 'var(--computers)', icon: '💻', soon: 'Coming later',
      text: 'How computers think: logic, programming, databases, security and AI.' },
    { id: 'french', name: 'French', c: 'var(--french)', icon: '🥐', soon: 'Coming later',
      text: 'Words, phrases and conversation, step by step.' }
  ];

  function render() {
    var p = learner();
    var signed = !!(session && session.user && session.user.email);
    $('hello').textContent = !signed ? 'Welcome to Uplore' : p ? 'Hello, ' + p.name + '! What shall we learn today?' : 'What shall we learn today?';
    $('lead').textContent = signed ? 'One home for the whole family: pick a learner, then a subject. Progress is saved for each learner.' : 'Maths, English and more for the whole family, from JK to grown-ups. Sign in, or create a free family account, to start learning.';
    // Learner chips
    var who = $('who');
    var email = session && session.user && session.user.email;
    var addBtn = '<button class="chip add" id="addl">+ Add a learner</button>';
    if (!email) who.innerHTML = '<button class="hbtn pri" id="sin2">Sign in to start</button><button class="hbtn" id="sup3">Create a free family account</button>';
    else if (!state.profiles.length) who.innerHTML = '<span class="lab">No learners yet.</span> ' + addBtn;
    else who.innerHTML = '<span class="lab">' + (p ? 'Who is learning?' : 'Who is learning? Tap a name.') + '</span>' + state.profiles.map(function (q) {
      return '<button class="chip" data-id="' + esc(q.id) + '" aria-pressed="' + (q.id === state.active) + '"><i style="background:' + esc(q.color || '#2f9e8f') + '">' + esc((q.name || '?').charAt(0).toUpperCase()) + '</i><span>' + esc(q.name) + '<small>' + (q.age > 18 ? 'grown-up' : 'age ' + esc(q.age)) + '</small></span></button>';
    }).join('') + addBtn;
    if (email) $('addl').onclick = function () { open('learner'); };
    else { $('sin2').onclick = function () { open('signin'); }; $('sup3').onclick = function () { open('signup'); }; }
    Array.prototype.forEach.call(who.querySelectorAll('button.chip[data-id]'), function (b) {
      b.onclick = function () { state.active = b.getAttribute('data-id'); if (!demo) { var s = read(KEY) || state; s.active = state.active; write(KEY, s); } render(); };
    });
    // Subject tiles
    var st = stats(p);
    $('subjects').innerHTML = SUBJECTS.map(function (s) {
      var prog = s.id === 'maths' && p ? '<div class="prog">' + esc(p.name) + ': ' + st.tried + (st.tried === 1 ? ' lesson' : ' lessons') + ' practised · ' + st.mastered + ' mastered<div class="bar"><i style="width:' + Math.min(100, Math.round(st.tried / MATHS_LESSONS * 100)) + '%"></i></div></div>' : '';
      var inner = '<div class="ic">' + s.icon + '</div><h3>' + s.name + '</h3><p>' + s.text + '</p>' + prog + (s.live ? '<span class="go">Open ' + s.name + ' →</span>' : '<span class="soon">' + s.soon + '</span>');
      // Uplore is where the learner is chosen: Maths opens straight into them.
      if (s.live && signed && state.profiles.length && !p) return '<button class="tile live" style="--c:' + s.c + ';text-align:left" data-pick>' + inner.replace('Open ' + s.name + ' →', 'Choose who is learning first') + '</button>';
      if (s.live && !signed) return '<button class="tile live" style="--c:' + s.c + ';text-align:left" data-signin>' + inner.replace('Open ' + s.name + ' →', 'Sign in to open ' + s.name) + '</button>';
      return s.live ? '<a class="tile live" style="--c:' + s.c + '" href="' + s.href + '">' + inner + '</a>' : '<div class="tile" style="--c:' + s.c + '" aria-disabled="true">' + inner + '</div>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('[data-signin]'), function (t) { t.onclick = function () { open('signin'); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-pick]'), function (t) { t.onclick = function () {
      var w = $('who'); w.classList.remove('ask'); void w.offsetWidth; w.classList.add('ask');
      try { w.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { w.scrollIntoView(); }
    }; });
    // Account
    $('acct').innerHTML = email ? 'Family account<br><b>' + esc(email) + '</b><br><button class="hbtn sm" id="gro">Grown-ups</button> <button class="out" id="out">Sign out</button><span class="warn" id="warn" hidden></span>'
      : '';
    if (email) { $('out').onclick = signOut; $('gro').onclick = grownups; }
    $('note').innerHTML = email
      ? '<span>☁️</span><span><b>Backed up.</b> Learners and progress sync across your devices. Learners, settings and the family account are in Grown-ups (top of the page).</span>'
      : '<span>🔒</span><span><b>A free family account keeps everyone\'s progress safe.</b> One account for the whole family: add each learner, and their progress follows them on every device.</span>';
  }
  // Sign out, the same way Maths does it: only when everything is backed up (or on a second tap),
  // then end this device's session and clear this family's learners from the device.
  var SB = 'https://kafkrkcuogvurfhigksk.supabase.co', SBKEY = 'sb_publishable_OYg8qCsdnHd0Dx_3JXcpBw_ZqBApST6';
  function body(p) { var r = {}; for (var k in p) if (k !== 'id' && k !== 'name' && k !== 't') r[k] = p[k]; return JSON.stringify(r) + '|' + p.name; }
  function backedUp() { var syn = read('pipmaths.synced') || {}, s = read(KEY) || { profiles: [] }; for (var i = 0; i < s.profiles.length; i++) if (syn[s.profiles[i].id] !== body(s.profiles[i])) return false; return true; }
  var armed = false;
  async function signOut() {
    if (!demo && !backedUp() && !armed) {
      // Back it up first; only if that fails, warn (a second tap signs out anyway).
      try { await syncAll(); } catch (e) {}
      if (!backedUp()) {
        armed = true; if ($('out')) $('out').textContent = 'Sign out anyway';
        var w = $('warn'); if (w) { w.hidden = false; w.textContent = 'Some progress could not be backed up just now (check the internet connection). Tap again to sign out anyway.'; }
        return;
      }
    }
    var tok = session && session.access_token;
    if (!demo) {
      try { localStorage.removeItem(SKEY); localStorage.removeItem('pipmaths.synced'); } catch (e) {}
      var s = read(KEY) || {}; s.profiles = []; s.active = null; write(KEY, s);
      if (tok) try { fetch(SB + '/auth/v1/logout?scope=local', { method: 'POST', headers: { apikey: SBKEY, Authorization: 'Bearer ' + tok } }).catch(function () {}); } catch (e) {}
    }
    session = null; state = { profiles: [], active: null, settings: state.settings || {} }; armed = false; gateOk = false;
    render();
  }
  // ---------- Family account on the home page (same account, storage and rules as Maths) ----------
  var SCHEMA = 'Math_schema', HOME = location.origin + location.pathname.replace(/[^/]*$/, '');
  function niceError(d, code) {
    var m = (d && (d.msg || d.message || d.error_description || d.error)) || '';
    if (/invalid login credentials/i.test(m)) return 'That email and password do not match.';
    if (/email not confirmed/i.test(m)) return 'Please confirm your email first: open the link we sent you.';
    if (/already registered|already been registered|user_already_exists/i.test(m)) return 'There is already an account with that email. Try signing in.';
    if (/password/i.test(m) && /(short|least|weak)/i.test(m)) return 'Please use a longer password (at least 8 characters).';

  }
  async function call(path, opt, retried) {
    opt = opt || {};
    var h = { apikey: SBKEY, 'Content-Type': 'application/json' };
    if (path.indexOf('/rest/') === 0) { h['Accept-Profile'] = SCHEMA; h['Content-Profile'] = SCHEMA; }
    if (opt.token) h.Authorization = 'Bearer ' + opt.token;

      try { await call('/rest/v1/rpc/delete_my_account', { method: 'POST', token: session.access_token, body: {} }); armed = true; close(); signOut(); open('done', 'The family account and all its saved progress have been deleted.'); }
      catch (e) { b.disabled = false; $('gst').textContent = e.message; }
    };
    admin();
  }
  // ---------- Admin: only for accounts on the server's admins list ----------
  var REGION_NAMES = { india: 'India', us: 'USA', canada: 'Canada', uk: 'UK' }, MODE_NAMES = { little: 'Little Learners', explore: 'Explorers', achieve: 'Achievers', adult: 'Adults' };
  async function admin() {
    var box = $('gadm'); if (!box || !session) return;
    var yes = false; try { yes = await call('/rest/v1/rpc/is_admin', { method: 'POST', token: session.access_token, body: {} }); } catch (e) {}
    if (yes !== true || !$('gadm')) return;
    box = $('gadm'); box.hidden = false; box.innerHTML = '<h4>Admin (only you see this)</h4><div class="gst">Loading…</div>';
    try {
      var o = await call('/rest/v1/rpc/admin_overview', { method: 'POST', token: session.access_token, body: {} });
      var titles = {}; try { var sk = await (await fetch('maths/content/skills.json')).json(); (sk.skills || []).forEach(function (x) { titles[x.id] = typeof x.title === 'object' ? x.title.en : x.title; }); } catch (e) {}
      var list = function (obj, names) { return Object.keys(obj || {}).sort(function (a, b) { return obj[b] - obj[a]; }).map(function (k) { return esc(names[k] || (k === 'unknown' ? '–' : k)) + ' ' + esc(obj[k]); }).join(' · ') || '–'; };
      var top = (o.topLessons || []).map(function (x) { return '<li>' + esc(titles[x.id] || x.id) + ' <span class="gst">' + esc(x.learners) + '</span></li>'; }).join('');
      if (!$('gadm')) return;
      box.innerHTML = '<h4>Admin (only you see this)</h4><div class="kpis"><div><b>' + esc(o.families) + '</b><span>families</span></div><div><b>' + esc(o.learners) + '</b><span>learners</span></div><div><b>' + esc(o.active7) + '</b><span>active this week</span></div><div><b>' + esc(o.newFamilies30) + '</b><span>new families (30 days)</span></div></div>' +
        '<p class="admline"><b>Countries:</b> ' + list(o.byCountry, REGION_NAMES) + '<br><b>Age groups:</b> ' + list(o.byMode, MODE_NAMES) + '</p>' +
        (top ? '<p class="admline"><b>Most practised lessons</b></p><ol>' + top + '</ol>' : '') +
        '<div class="btnrow"><a class="hbtn sm" href="maths/#admin">Maths: every lesson in every mode →</a><a class="hbtn sm" href="maths/diag.html">Device check</a></div>';
    } catch (e) { if ($('gadm')) box.innerHTML = '<h4>Admin</h4><div class="gst">' + esc(e.message) + '</div>'; }
  }
  // Maths sends visitors here to sign in (#signin), or after their sign-in ended (#signin-again).
  // After signing in they go straight back to Maths (if the family has learners already).
  var backTo = null;
  function fromMaths() {
    var hs = location.hash;
    if (hs === '#grownups') { history.replaceState(null, '', location.pathname + location.search); if (session && session.access_token) grownups(); else open('signin'); return; }
    if (hs !== '#signin' && hs !== '#signin-again') return;
    history.replaceState(null, '', location.pathname + location.search);
    if (session && session.access_token) return;
    backTo = 'maths/';
    open('signin', hs === '#signin-again' ? 'Your sign-in has ended. Please sign in again.' : 'Please sign in to open Maths.');
    var m = $('msg'); if (m) m.className = 'msg ok';
  }
  fromEmailLink();
  render();
  fromMaths();
  window.addEventListener('storage', function (e) { if (e.key === KEY || e.key === SKEY) { state = read(KEY) || state; session = read(SKEY); render(); } });
})();
</script>
</body>
</html>
